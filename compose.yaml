services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: always
    network_mode: host
    environment:
      MINIO_ROOT_USER: gitlab-runner
      MINIO_ROOT_PASSWORD: myu@mjw0grw.YNM1vgq
    volumes:
      - /mnt/disk1t/minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
